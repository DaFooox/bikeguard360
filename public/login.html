<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – BikeGuard360</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <a href="/" class="logo auth-logo" aria-label="Zur Startseite">
      <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <path d="M16 7v9l6 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>BikeGuard<strong>360</strong></span>
    </a>

    <div class="card auth-card">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-mode="login">Anmelden</button>
        <button class="tab" role="tab" data-mode="register">Registrieren</button>
      </div>

      <form id="auth-form" novalidate>
        <label class="field" data-only="register">
          <span>Name</span>
          <input name="name" autocomplete="name" placeholder="Alex Muster">
        </label>
        <label class="field">
          <span>E-Mail</span>
          <input name="email" type="email" autocomplete="email" placeholder="du@beispiel.de" required>
        </label>
        <label class="field">
          <span>Passwort</span>
          <input name="password" type="password" autocomplete="current-password" required minlength="8">
        </label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="btn btn-block" type="submit" id="submit">Anmelden</button>
      </form>

      <p class="demo-hint" data-only="login">
        Demo-Zugang: <code>demo@bikeguard360.de</code> / <code>demo1234</code>
        <button type="button" class="link-btn" id="fill-demo">Einsetzen</button>
      </p>
    </div>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
